[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-foundations-workspace"
version = "0.1.0"
description = "Source and evidence packages for Project Control and Project-Lab"
requires-python = ">=3.10"

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
pythonpath = ["packages/project-evidence/src", "packages/project-source/src"]
