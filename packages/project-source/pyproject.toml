[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-source"
version = "0.1.2"
description = "Revision-aware source discovery, indexing and bounded context"
requires-python = ">=3.10"
dependencies = ["project-evidence>=0.1.0"]

[tool.setuptools.packages.find]
where = ["src"]
